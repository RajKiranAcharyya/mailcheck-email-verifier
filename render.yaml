services:
  - type: web
    name: mailcheck-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_FILE
        value: ./prod.sqlite3
      - key: CORS_ORIGIN
        value: '*'
      - key: JOB_CONCURRENCY
        value: 5
