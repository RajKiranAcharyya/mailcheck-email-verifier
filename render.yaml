services:
  - type: web
    name: mailcheck-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_FILE
        value: ./prod.sqlite3
      - key: CORS_ORIGIN
        value: '*'
      - key: JOB_CONCURRENCY
        value: 5
